spring.application.name=socioclub-backend

# Se pueden reemplazar desde el entorno, por ejemplo DB_PASSWORD=tu_clave.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/socioclub?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Argentina/Buenos_Aires}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.thymeleaf.cache=false
