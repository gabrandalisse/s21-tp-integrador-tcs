<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" role="img" aria-labelledby="t">
  <title id="t">Ilustración de la cancha del club con un algarrobo al costado</title>
  <rect width="600" height="360" fill="#eaf2e6"/>
  <!-- Sol -->
  <circle cx="500" cy="80" r="36" fill="#f3c969"/>
  <!-- Cancha -->
  <path d="M40 330 L140 170 L460 170 L560 330 Z" fill="#5f9e5a"/>
  <path d="M40 330 L140 170 L460 170 L560 330 Z" fill="none" stroke="#fff" stroke-width="3"/>
  <line x1="300" y1="170" x2="300" y2="330" stroke="#fff" stroke-width="3"/>
  <ellipse cx="300" cy="245" rx="55" ry="22" fill="none" stroke="#fff" stroke-width="3"/>
  <!-- Algarrobo -->
  <rect x="58" y="120" width="14" height="70" fill="#8a5a2b"/>
  <ellipse cx="65" cy="105" rx="55" ry="35" fill="#4c8a48"/>
  <ellipse cx="40" cy="120" rx="28" ry="18" fill="#3f7a3c"/>
  <ellipse cx="95" cy="118" rx="28" ry="18" fill="#3f7a3c"/>
  <!-- Pelota -->
  <circle cx="330" cy="290" r="10" fill="#fff" stroke="#1f5130" stroke-width="2"/>
</svg>
